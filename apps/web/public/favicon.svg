<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Arbiter mark (art §11): nested hexagonal containment frame around
       an all-seeing eye with a recycling-arrow pupil. -->
  <rect width="64" height="64" fill="#080b08"/>
  <polygon points="32,4 56,17 56,47 32,60 8,47 8,17" fill="none" stroke="#b4ff39" stroke-width="7"/>
  <polygon points="32,10 51,20 51,44 32,54 13,44 13,20" fill="none" stroke="#b4ff39" stroke-width="3"/>
  <!-- eye -->
  <path d="M14 32 Q32 16 50 32 Q32 48 14 32 Z" fill="#e6efe3"/>
  <circle cx="32" cy="32" r="11" fill="#ffb703" opacity="0.7"/>
  <!-- recycling-arrow pupil -->
  <g fill="#080b08">
    <path d="M32 26 l-6 9 h4 v7 h4 v-7 h4 z" transform="rotate(120 32 30)"/>
    <path d="M32 26 l-6 9 h4 v7 h4 v-7 h4 z" transform="rotate(240 32 30)"/>
    <path d="M32 26 l-6 9 h4 v7 h4 v-7 h4 z"/>
  </g>
  <!-- cardinals + circuit traces -->
  <g stroke="#b4ff39" stroke-width="1.5">
    <line x1="14" y1="17" x2="14" y2="13"/>
    <line x1="50" y1="17" x2="50" y2="13"/>
    <line x1="14" y1="47" x2="14" y2="51"/>
    <line x1="50" y1="47" x2="50" y2="51"/>
    <path d="M14 8 h6 M44 8 h6" stroke-dasharray="2 2"/>
  </g>
</svg>