{{- if not .Values.existingSecret -}}
{{- if or .Values.geminiApiKey .Values.smtp.password .Values.bullBoard.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecocide.secretName" . }}
  labels:
    {{- include "ecocide.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if .Values.bullBoard.password }}
  BULL_BOARD_PASSWORD: {{ .Values.bullBoard.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
