{{- /*
The runtime Secret: every credential the app, the database and the queue need.

Source of truth is `secrets.data` in a values file that is NOT committed
(values.production.example.yaml documents the shape). `secrets.existingSecret`
remains available for Secret stores managed outside Helm, and wins when set.

Values that are present are used verbatim. Empty ones are:
  • reused from the Secret already in the cluster (via `lookup`) — this is what
    keeps sessions and the database working across `helm upgrade`;
  • otherwise generated, but ONLY when `secrets.generateMissing` is true. With it
    false (the production setting) a missing key fails the render instead of
    quietly minting a random value that breaks the next reinstall.
*/ -}}
{{- if and (not .Values.secrets.create) (not .Values.secrets.existingSecret) }}
{{- fail "secrets: nothing to read credentials from. Set secrets.create=true and put them in secrets.data, or point secrets.existingSecret at a Secret you manage." }}
{{- end }}

{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "ecocide.secretName" . }}
{{- $generateMissing := .Values.secrets.generateMissing }}
{{- $bundled := eq .Values.postgres.mode "bundled" }}
{{- /* Whether a Postgres password is needed at all: the bundled database always
       initialises from one, an external server only when DATABASE_URL is not
       given (the URL carries its own credentials). */ -}}
{{- $needsPgPassword := or $bundled (not .Values.secrets.data.DATABASE_URL) }}

{{- /* A database URL that disagrees with the Secret password would initdb with
       one credential and connect with another — the app locked out of its own
       volume. Fail here, where the message can say why. */ -}}
{{- if and $bundled .Values.secrets.data.DATABASE_URL (not .Values.secrets.data.POSTGRES_PASSWORD) }}
{{- fail "secrets: secrets.data.DATABASE_URL is set while postgres.mode=bundled, but POSTGRES_PASSWORD is empty. The database is initialised with POSTGRES_PASSWORD, so a URL carrying a different password cannot connect. Set secrets.data.POSTGRES_PASSWORD too, or set postgres.mode=external." }}
{{- end }}
{{- if and (not $bundled) (not .Values.secrets.data.DATABASE_URL) (not .Values.secrets.data.POSTGRES_PASSWORD) }}
{{- fail "secrets: postgres.mode=external needs either secrets.data.DATABASE_URL or secrets.data.POSTGRES_PASSWORD (to build it from postgres.external.*)." }}
{{- end }}

{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{- $existingData = $existing.data }}
{{- end }}

{{- /* Better Auth signing key. */ -}}
{{- $authSecret := "" }}
{{- if hasKey $existingData "BETTER_AUTH_SECRET" }}
{{- $authSecret = index $existingData "BETTER_AUTH_SECRET" | b64dec }}
{{- end }}
{{- if not $authSecret }}
{{- $authSecret = .Values.secrets.data.BETTER_AUTH_SECRET }}
{{- end }}
{{- if not $authSecret }}
{{- if $generateMissing }}
{{- $authSecret = randAlphaNum 48 }}
{{- else }}
{{- fail "secrets: BETTER_AUTH_SECRET is empty and secrets.generateMissing=false. Set it in secrets.data (openssl rand -hex 32) — the app refuses to start in production without it." }}
{{- end }}
{{- end }}

{{- /* Database password: the role's password and the one in DATABASE_URL. Only
       computed when something needs it (see $needsPgPassword). */ -}}
{{- $pgPassword := "" }}
{{- if $needsPgPassword }}
{{- if hasKey $existingData "POSTGRES_PASSWORD" }}
{{- $pgPassword = index $existingData "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- if not $pgPassword }}
{{- $pgPassword = .Values.secrets.data.POSTGRES_PASSWORD }}
{{- end }}
{{- if not $pgPassword }}
{{- if $generateMissing }}
{{- $pgPassword = randAlphaNum 24 }}
{{- else }}
{{- fail "secrets: POSTGRES_PASSWORD is empty and secrets.generateMissing=false. Set it in secrets.data (openssl rand -hex 24) — it must match the password the database volume was initialised with." }}
{{- end }}
{{- end }}
{{- end }}

{{- if and (not $generateMissing) (eq .Values.app.gemini.mode "api") (not .Values.secrets.data.GEMINI_API_KEY) }}
{{- fail "secrets: app.gemini.mode=api but secrets.data.GEMINI_API_KEY is empty (secrets.generateMissing=false). Every audit would fail; set the key or point app.gemini.mode at a reachable engine." }}
{{- end }}

{{- /* values.production.example.yaml ships literal REPLACE_ME placeholders. A
       deployment that keeps them would run with a published database password
       and a published signing key — refuse rather than look healthy. */ -}}
{{- if hasPrefix "REPLACE_ME" $authSecret }}
{{- fail "secrets: BETTER_AUTH_SECRET is still the REPLACE_ME placeholder from values.production.example.yaml. Generate one: openssl rand -hex 32" }}
{{- end }}
{{- if and $needsPgPassword (hasPrefix "REPLACE_ME" $pgPassword) }}
{{- fail "secrets: POSTGRES_PASSWORD is still the REPLACE_ME placeholder from values.production.example.yaml. Generate one: openssl rand -hex 24" }}
{{- end }}

{{- $urlContext := dict "Values" .Values "Release" .Release "Chart" .Chart "password" $pgPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ecocide.labels" . | nindent 4 }}
  {{- if .Values.secrets.keepOnUninstall }}
  annotations:
    # Only meaningful when the values do NOT carry the credentials: the next
    # install would otherwise mint new ones against an existing data volume.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ $authSecret | quote }}
  DATABASE_URL: {{ include "ecocide.databaseUrl" $urlContext | quote }}
  {{- with include "ecocide.redisUrl" . }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- if $needsPgPassword }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  {{- end }}
  {{- with .Values.secrets.data.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.SMTP_USER }}
  SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.SMTP_PASS }}
  SMTP_PASS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.BULL_BOARD_PASS }}
  BULL_BOARD_PASS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.S3_ACCESS_KEY_ID }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.S3_SECRET_ACCESS_KEY }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.extra }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
