# Default values for ecocide.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/zaro/ecocide
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API token?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # Essential for camera photo uploads in base64 format
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
  hosts:
    - host: ecocide.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: ecocide-tls
  #    hosts:
  #      - ecocide.local

# Persistent storage for SQLite dossiers and scan audit logs
persistence:
  enabled: true
  # storageClass: "-"
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /data

# Google Gemini API key configuration
# Provide directly here OR reference an existing secret
geminiApiKey: ""

# Existing Secret integration (preferred for GitOps / SealedSecrets / ExternalSecrets)
existingSecret: ""
existingSecretKey: "GEMINI_API_KEY"

# Default avatar engine for background holographic synthesis
# Options: 'gemini-image-vector' | 'gemini-image-pixel' | 'gemini-text-svg'
avatarEngine: "gemini-image-vector"

# Additional arbitrary environment variables
env: {}

# Public base URL used to build permalinks inside outgoing emails
appBaseUrl: "http://localhost:5173"

# Outgoing email (SMTP). Leave smtp.host empty to disable sending — the server
# then logs messages via nodemailer's jsonTransport instead.
smtp:
  host: ""
  port: 587
  secure: false
  user: ""
  # Provide the password inline, or reference a key in an existing secret below
  password: ""
  from: "ECOCIDE <no-reply@ecocide.local>"
  replyTo: ""
  existingSecret: ""
  existingSecretKey: "SMTP_PASSWORD"

# Async job queue (BullMQ). Uses an external Redis via redis.url, or bundles a
# small single-replica Redis when redis.enabled. With neither set, the server
# runs jobs inline (no Redis required) — fine for local/dev.
redis:
  # External/managed Redis connection string, e.g. redis://:pass@host:6379
  url: ""
  # Bundle a single-replica Redis for testing clusters (not for production)
  enabled: false
  persistence:
    enabled: true
    size: 512Mi

# Bull Board queue dashboard (mounted at /admin/queues, protected by Basic auth).
# Requires the BullMQ queue (Redis). Leave bullBoard.password empty to disable.
bullBoard:
  enabled: true
  user: "admin"
  password: ""
  existingSecret: ""
  existingSecretKey: "BULL_BOARD_PASSWORD"

# Database migrations
# When enabled, a "migrate" init container applies drizzle-kit migrations to the
# shared data volume before the main app starts, and the app container's
# AUTO_MIGRATE is set to "false" so schema changes run exactly once per pod.
# Set to false if you manage migrations yourself (the app then migrates at boot).
migrations:
  enabled: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

nodeSelector: {}

tolerations: []

affinity: {}
