name: Build, Publish & Deploy to Kubernetes

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build, Publish & Helm Upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update Helm Deployment in Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p ~/.kube
            # Support both raw YAML and base64-encoded kubeconfig in secrets.KUBECONFIG
            if echo "$KUBECONFIG_DATA" | grep -q "apiVersion:"; then
              echo "$KUBECONFIG_DATA" > ~/.kube/config
            else
              echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
            fi
            chmod 600 ~/.kube/config
          fi

          helm upgrade aipocalypse ./charts/aipocalypse \
            --namespace ai-fun \
            --reuse-values \
            --set image.tag="${TAG_NAME}"
