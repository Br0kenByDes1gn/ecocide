name: Build image

# Builds the production image and publishes it to GitHub Container Registry.
#
# Tags published for a build:
#   latest        push to the default branch (what a first deploy can pull)
#   main          the branch name
#   sha-<7>       every build — the immutable one; pin this in values.yaml
#   0.1.0, 0.1    from a `v0.1.0` git tag (the `v` is stripped)
#
# A pull request only runs the verify job (no push), so forks and PRs cannot
# publish. The image is a plain amd64 build of the repo Dockerfile — the chart
# runs it as-is (API + built SPA in one container).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same workspace build the Dockerfile runs, so a lockfile or type error
      # fails here in ~90s instead of inside the image build.
      - run: pnpm build
      # Hermetic: the DB tests boot PGlite in-memory, so no services are needed.
      - run: pnpm test
      # helm is preinstalled on ubuntu-latest; the chart ships in this repo.
      - run: helm lint charts/ecocide

  publish:
    name: Publish
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        id: image
        # GHCR requires a lowercase repository path; github.repository keeps the
        # owner's casing (Br0kenByDes1gn/ecocide), so normalise it here.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ECOCIDE
            org.opencontainers.image.description=AI Supreme Arbiter of Consumption — API + PWA in one container

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pin one of these in your values file: \`image.tag\`."
          } >> "$GITHUB_STEP_SUMMARY"
